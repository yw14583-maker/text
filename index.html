<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大英翻译期中背诵指南</title>
    <style>
        /* CSS 变量：定义浅色和深色模式的色彩 */
        :root {
            --bg-color: #f4f7f6;
            --text-main: #333333;
            --text-muted: #666666;
            --card-bg: #ffffff;
            --card-border: #e0e0e0;
            --header-bg: rgba(255, 255, 255, 0.95);
            --header-shadow: rgba(0, 0, 0, 0.05);
            --skeleton-color: #1a1a1a;
            --detail-bg: #f9fbfc;
            --detail-color: #4a6572;
            --accent-color: #3498db;
            --hover-bg: #f0f4f8;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --card-bg: #1e1e1e;
            --card-border: #333333;
            --header-bg: rgba(30, 30, 30, 0.95);
            --header-shadow: rgba(0, 0, 0, 0.2);
            --skeleton-color: #ffffff;
            --detail-bg: #2a2a2a;
            --detail-color: #90caf9;
            --accent-color: #64b5f6;
            --hover-bg: #2c2c2c;
        }

        /* 全局基础样式 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
            line-height: 1.6;
        }

        /* 顶部悬浮导航 */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: var(--header-bg);
            backdrop-filter: blur(5px);
            box-shadow: 0 2px 10px var(--header-shadow);
            z-index: 1000;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .theme-toggle {
            background: none;
            border: 2px solid var(--card-border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* 主体内容容器 */
        .container {
            max-width: 800px;
            margin: 80px auto 40px;
            padding: 0 15px;
        }

        /* 卡片样式 */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: background-color 0.3s, border-color 0.3s;
        }

        /* 卡片标题栏（可点击） */
        .card-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            background-color: transparent;
            transition: background-color 0.2s;
        }

        .card-header:hover {
            background-color: var(--hover-bg);
        }

        .card-header .icon {
            font-size: 1.5rem;
            color: var(--text-muted);
            transition: transform 0.3s;
        }

        /* 卡片内容区（折叠状态） */
        .card-content {
            display: none;
            padding: 0 20px 20px;
            border-top: 1px solid var(--card-border);
        }

        .card.active .card-content {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        .card.active .card-header .icon {
            transform: rotate(45deg);
        }

        /* 内容排版细节 */
        h3 {
            font-size: 1rem;
            color: var(--accent-color);
            margin: 15px 0 10px;
            display: flex;
            align-items: center;
        }

        .skeleton-box {
            font-weight: bold;
            color: var(--skeleton-color);
            font-size: 1.05rem;
            margin-bottom: 10px;
        }

        .skeleton-box p {
            margin-bottom: 6px;
        }

        .detail-box {
            background-color: var(--detail-bg);
            padding: 12px 20px;
            border-radius: 6px;
            color: var(--detail-color);
            font-size: 0.95rem;
        }

        .detail-box li {
            margin-bottom: 6px;
        }

        /* 动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 响应式适配 */
        @media (max-width: 600px) {
            header h1 {
                font-size: 1.1rem;
            }
            .container {
                margin-top: 70px;
            }
            .card-header {
                font-size: 1rem;
                padding: 14px 15px;
            }
            .card-content {
                padding: 0 15px 15px;
            }
        }
    </style>
</head>

        // 初始化页面渲染
        function renderCards() {
            const container = document.getElementById('content-container');
            
            translations.forEach((item, index) => {
                // 拼接骨架HTML
                const skeletonHtml = item.skeleton.map(s => `<p>${s}</p>`).join('');
                // 拼接细节HTML
                const detailsHtml = item.details.map(d => `<li>${d}</li>`).join('');

                const cardHtml = `
                    <div class="card">
                        <div class="card-header" onclick="toggleCard(this)">
                            <span>${item.title}</span>
                            <span class="icon">+</span>
                        </div>
                        <div class="card-content">

                            <div class="skeleton-box">

                            </div>
                            <h3>💡 固定细节（必背）</h3>
                            <ul class="detail-box">
                                ${detailsHtml}
                            </ul>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        // 折叠/展开逻辑
        function toggleCard(headerElement) {
            const card = headerElement.parentElement;
            card.classList.toggle('active');
            
            // 切换加减号
            const icon = headerElement.querySelector('.icon');
            if (card.classList.contains('active')) {
                icon.textContent = '×';
                icon.style.transform = 'rotate(90deg)';
            } else {
                icon.textContent = '+';
                icon.style.transform = 'rotate(0deg)';
            }
        }

        // 深浅色主题切换逻辑
        function toggleTheme() {
            const body = document.documentElement;
            const btn = document.getElementById('themeBtn');
            
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                btn.textContent = '切换深色';
            } else {
                body.setAttribute('data-theme', 'dark');
                btn.textContent = '切换浅色';
            }
        }

        // 页面加载完成后执行渲染
        window.onload = renderCards;
