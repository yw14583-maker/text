<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>期末英语摘要写作模拟系统</title>
    <link rel="stylesheet" href="style.css?v=20261019y">
</head>
<body>

<div class="container">
    <h1>英文摘要写作模拟系统</h1>
    <div class="subtitle">2026-2027第一学期期末考试题库</div>

    <section>
        <div>
            <div>
                <h3 class="profile-major">工业设计</h3>
                <h3 class="profile-class">25-1</h3>
                <h3 class="profile-name">吴嘉俊</h3>
                <h4>有问题可以加我微信一起解决 微信号：<b>w857712022</b></h4>

            </div>
        </div>
    </section>
    <div class="control-panel">
        <div class="btn-group">
            <button onclick="drawRandomQuestion()">随机抽题</button>
            <button class="outline" onclick="prevQuestion()">上一题</button>
            <button class="outline" onclick="nextQuestion()">下一题 </button>
            <select id="questionSelect" onchange="selectQuestion(this.value)">
                <option value="">-- 选择具体题目 --</option>
            </select>
        </div>
        <div class="timer-box">
             <span id="timerDisplay" onclick="toggleTimer()" title="点击开始/暂停">20:00</span>
            <button class="outline" style="padding: 2px 8px; font-size: 12px; margin-left: 5px;" onclick="resetTimer()">重置</button>
        </div>
    </div>

   
    <div id="questionCard" class="card">
        <div class="question-header">
            <h2 id="qTitle" class="question-title"></h2>
        </div>
        
        <div id="qDirections" class="directions"></div>
        
     
        <div class="writing-area">
            <h5>请在下方输入英文摘要<span class="target-hint">目标 120–150 词</span></h5>
            <textarea id="userAnswer" spellcheck="false" autocorrect="off" autocapitalize="off" placeholder="Type your English abstract here..." oninput="updateWordCount();saveCurrentAnswer()"></textarea>
            
            <div class="action-row">
                <span class="word-count" id="wordCountDisplay">单词数: 0 词</span>
                <div class="btn-group">
                    <button class="warning" onclick="clearAnswer()">清空</button>
                    <button class="score" onclick="scoreAnswer()">评分</button>
                    <button class="secondary" onclick="toggleAnswer()">参考答案</button>
                </div>
            </div>
            <div id="scorePanel" class="score-panel"></div>
        </div>

        
        <div id="answerBox" class="answer-section">
            <div class="ans-title">参考答案:</div>
            <div id="qAbstract" class="abstract-text"></div>
            <div class="ans-title">关键词:</div>
            <div id="qKeywords" class="keywords"></div>
        </div>
    </div>
</div>

<script src="text-pos.js?v=20261019y"></script>
<script src="grammar-rules.js?v=20261019y"></script>
<script src="app.js?v=20261019y"></script>

</body>
</html>
